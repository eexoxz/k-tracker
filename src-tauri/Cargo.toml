[package]
name = "k-tracker"
version = "0.1.1"
description = "A lightweight desktop music release tracker."
authors = ["K-tracker"]
edition = "2021"

[lib]
name = "k_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
